---

- name: Restart rootless docker service
  become: true
  become_user: dockeruser
  ansible.builtin.systemd_service:
    name: docker.service
    scope: user
    enabled: true
    state: restarted
    daemon_reload: true

- name: Gather docker facts
  ansible.builtin.include_tasks: info.yml
