# https://docs.docker.com/engine/install/debian/
# https://docs.docker.com/engine/logging/configure/

---

- name: Prepare docker install
  block:
    - name: Install docker prerequisite packages
      ansible.builtin.apt:
        cache_valid_time: 86400
        name: "{{ karo_docker_prereq_packages }}"
        state: present

    - name: Add docker package repository
      ansible.builtin.deb822_repository:
        name: "docker"
        types: deb
        uris: "{{ docker_repo_url }}"
        suites: "{{ ansible_facts.distribution_release }}"
        components: "stable"
        signed_by: "{{ docker_repo_url }}/gpg"
        state: "present"
      vars:
        docker_repo_url: https://download.docker.com/linux/debian

- name: Install docker packages
  ansible.builtin.apt:
    cache_valid_time: 300
    name: "{{ karo_docker_packages }}"
    state: present

- name: Upgrade docker packages
  ansible.builtin.apt:
    cache_valid_time: 300
    name: "{{ karo_docker_packages }}"
    state: latest
    only_upgrade: true
  notify:
    - Restart rootless docker service

- name: Setup rootless docker
  ansible.builtin.include_tasks: rootless.yml
