---

- name: Create ansible temp directory
  ansible.builtin.file:
    path: /root/.ansible/tmp
    mode: "0700"
    state: directory

- name: Install essential system packages
  ansible.builtin.apt:
    cache_valid_time: 86400
    name: "{{ karo_system_packages }}"
    state: present

- name: Configure kernel
  block:
    - name: Render kernel parameters template
      ansible.builtin.template:
        src: sysctl.conf.j2
        dest: /etc/sysctl.d/karo.conf
        mode: "0644"
      notify: Reload sysctl config

    - name: Render kernel modules template
      ansible.builtin.template:
        src: modules.conf.j2
        dest: /etc/modules-load.d/karo.conf
        mode: "0644"
      notify: Restart systemd-modules-load

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

- name: Configure system
  block:
    - name: Render bash configuration templates for karo
      ansible.builtin.template:
        src: "{{ item }}.sh.j2"
        dest: "/home/karo/.{{ item }}"
        mode: "0644"
        owner: karo
        group: karo
      loop:
        - bash_logout
        - profile

    - name: Add hostname to hosts file
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s+debian(\s+{{ inventory_hostname }})?$'
        line: "127.0.1.1 debian {{ inventory_hostname }}"

    - name: Set system hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
        use: systemd

    - name: Set system motd
      ansible.builtin.copy:
        content: "{{ karo_system_motd_raw }}"
        dest: /etc/motd
        mode: "0644"
