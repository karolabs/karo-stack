# https://docs.docker.com/engine/install/debian/
# https://docs.docker.com/engine/logging/configure/

---

- name: Add docker package repository
  ansible.builtin.deb822_repository:
    name: "docker"
    types: deb
    uris: "{{ docker_repo_url }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: "stable"
    signed_by: "{{ docker_repo_url }}/gpg"
    state: "present"
  vars:
    docker_repo_url: https://download.docker.com/linux/debian

- name: Check existing docker setup
  block:
    - name: Look up existing dockeruser
      ansible.builtin.getent:
        database: passwd
        key: dockeruser
        fail_key: false

    - name: Check docker update readiness
      when:
        - ansible_facts['getent_passwd']['dockeruser'] is not none
        - docker_update_enabled
      block:
        - name: Gather docker facts
          ansible.builtin.include_tasks: info.yml

        - name: Prevent docker update (containers running)
          ansible.builtin.set_fact:
            docker_update_enabled: false
          when: docker_facts.host_info.ContainersRunning > 0

- name: Install docker packages
  ansible.builtin.apt:
    cache_valid_time: 300
    name: "{{ karo_docker_packages }}"
    state: present

- name: Upgrade docker packages
  ansible.builtin.apt:
    cache_valid_time: 300
    name: "{{ karo_docker_packages }}"
    state: latest
    only_upgrade: true
  notify:
    - Restart rootless docker service
    - Gather docker facts
  when: docker_update_enabled

- name: Setup rootless docker
  ansible.builtin.include_tasks: rootless.yml
