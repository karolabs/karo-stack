---

- name: Setup rootless docker user
  block:
    - name: Create dockeruser group
      ansible.builtin.group:
        name: dockeruser
        state: present

    - name: Create dockeruser user
      ansible.builtin.user:
        name: dockeruser
        group: dockeruser
        shell: /bin/bash
        create_home: true
        state: present

    - name: Create dockeruser home directories
      ansible.builtin.file:
        path: "/home/dockeruser/{{ item.dir }}"
        mode: "{{ item.mode }}"
        owner: dockeruser
        group: dockeruser
        state: directory
      loop:
        - dir: .ansible/tmp
          mode: "0700"
        - dir: .ssh
          mode: "0700"
        - dir: .config/docker
          mode: "0700"
      loop_control:
        label: "{{ item.dir }}"

    - name: Copy authorized_keys for dockeruser
      ansible.builtin.copy:
        src: /home/karo/.ssh/authorized_keys
        remote_src: true
        dest: /home/dockeruser/.ssh/authorized_keys
        mode: "0600"
        owner: dockeruser
        group: dockeruser

    - name: Set bash profile for dockeruser
      ansible.builtin.copy:
        src: profile
        dest: /home/dockeruser/.profile
        mode: "0644"
        owner: dockeruser
        group: dockeruser

    - name: Enable dockeruser lingering
      ansible.builtin.command:
        argv:
          - /usr/bin/loginctl
          - enable-linger
          - dockeruser
        creates: /var/lib/systemd/linger/dockeruser

- name: Prepare rootless docker installation
  block:
    - name: Disable rootful docker services
      ansible.builtin.service:
        name: "{{ item }}"
        enabled: false
        state: stopped
      loop:
        - docker.service
        - docker.socket
        - containerd.service

    - name: Remove rootful docker socket
      ansible.builtin.file:
        path: /var/run/docker.sock
        state: absent

    - name: Configure rootless docker daemon
      ansible.builtin.copy:
        src: daemon.json
        dest: /home/dockeruser/.config/docker/daemon.json
        mode: "0644"
        owner: dockeruser
        group: dockeruser
      notify: Restart rootless docker service

- name: Install rootless docker
  become: true
  become_user: dockeruser
  environment:
    XDG_RUNTIME_DIR: /run/user/1001
    PATH: "/home/dockeruser/bin:{{ ansible_facts.env.PATH }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/dockerd-rootless-setuptool.sh
      - install
    creates: /run/user/1001/docker.sock

- name: Create docker compose directory
  ansible.builtin.file:
    path: /srv/docker
    mode: "0774"
    owner: dockeruser
    group: dockeruser
    state: directory

- name: Log into docker registries
  become: true
  become_user: dockeruser
  community.docker.docker_login:
    docker_host: unix:///run/user/1001/docker.sock
    registry_url: "{{ item }}"
    username: "{{ karo_docker_login_username }}"
    password: "{{ karo_docker_login_token }}"
  loop:
    - docker.io
    - dhi.io
  when: karo_docker_login_enabled
