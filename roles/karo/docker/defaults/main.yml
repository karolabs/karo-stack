---

docker_update_enabled: true

karo_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# login required for docker hardened images
karo_docker_login_enabled: true

# docker account credentials
karo_docker_login_username: ""
karo_docker_login_token: ""
