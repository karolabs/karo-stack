---

- name: Enable sshd service
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: started

- name: Render sshd configuration template
  ansible.builtin.template:
    src: karo.conf.j2
    dest: /etc/ssh/sshd_config.d/karo.conf
    mode: "0644"
  notify:
    - Restart sshd service
    - Reload systemd
